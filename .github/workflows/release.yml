name: SqlCraft Cross-Platform Build & Release

on:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Build & Rust Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend (tsc + vite build)
        run: npm run build

      - name: Run Rust core tests
        working-directory: src-tauri
        run: cargo test

  build-tauri:
    name: Bundle Tauri (${{ matrix.platform }})
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "SqlCraft v__VERSION__"
          releaseBody: "Cross-platform Tauri 2.0 release for Windows, Linux, and macOS."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build & package Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          npx tauri build --no-bundle -- --features portable
          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path "$stage\config" | Out-Null
          New-Item -ItemType File -Force -Path "$stage\.portable" | Out-Null
          Copy-Item "src-tauri\target\release\sqlcraft.exe" "$stage\SqlCraft.exe"
          $zipPath = "SqlCraft_${version}_x64-portable.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          gh release upload "v$version" $zipPath --clobber

      - name: Upload Windows Portable artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: SqlCraft-Windows-Portable
          path: SqlCraft_*_x64-portable.zip
