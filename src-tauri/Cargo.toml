[package]
name = "sqlcraft"
version = "0.1.1"
description = "Cross-platform database workbench built with Tauri 2.0"
authors = ["SqlCraft"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "sqlcraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "postgres", "sqlite", "chrono", "json", "uuid", "rust_decimal"] }
rust_decimal = "1"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "5"
futures-util = "0.3"
